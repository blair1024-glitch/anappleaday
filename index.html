<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>An Apple A Day</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🍎</text></svg>">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="top">
    <div class="wrap">
      <div class="title-row">
        <h1 id="site-title">An Apple A Day</h1>
        <div class="lang" role="group" aria-label="Language">
          <button type="button" data-lang="zh">中文</button>
          <button type="button" data-lang="en">EN</button>
        </div>
      </div>
      <p id="site-subtitle" class="subtitle"></p>

      <section id="daily" class="daily" hidden>
        <div class="daily-head">
          <span id="daily-label" class="daily-label"></span>
          <span id="daily-date" class="daily-date"></span>
          <button type="button" id="shuffle" class="shuffle"></button>
        </div>
        <a id="daily-card" class="daily-card" target="_blank" rel="noopener noreferrer"></a>
      </section>

      <input id="search" type="search" autocomplete="off">
      <nav id="nav" class="nav"></nav>
    </div>
  </header>

  <main class="wrap">
    <div id="content"></div>
    <p id="empty" class="empty" hidden></p>
  </main>

  <footer class="wrap foot">
    <div>🍎 An Apple A Day</div>
    <!-- Visitor counter by busuanzi.ibruce.info; hidden automatically if the service doesn't respond -->
    <div id="busuanzi_container_site_pv" class="stats" style="display:none">
      👀 <b id="busuanzi_value_site_pv"></b> <span id="pv-label"></span>
      · <b id="busuanzi_value_site_uv"></b> <span id="uv-label"></span>
    </div>
  </footer>
  <script async src="https://busuanzi.ibruce.info/busuanzi/2.3/busuanzi.pure.mini.js"></script>

  <script>
    // Always fetch the latest links/app so new sites show up right after a deploy
    ["links.js", "app.js"].forEach(function (src) {
      var s = document.createElement("script");
      s.src = src + "?v=" + Date.now();
      s.async = false;
      document.body.appendChild(s);
    });
  </script>
</body>
</html>
