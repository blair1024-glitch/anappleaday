<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>An Apple A Day</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🍎</text></svg>">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="top">
    <div class="wrap">
      <div class="title-row">
        <h1 id="site-title">An Apple A Day</h1>
        <div class="lang" role="group" aria-label="Language">
          <button type="button" data-lang="zh">中文</button>
          <button type="button" data-lang="en">EN</button>
        </div>
      </div>
      <p id="site-subtitle" class="subtitle"></p>

      <section id="daily" class="daily" hidden>
        <div class="daily-head">
          <span id="daily-label" class="daily-label"></span>
          <span id="daily-date" class="daily-date"></span>
          <button type="button" id="shuffle" class="shuffle"></button>
        </div>
        <a id="daily-card" class="daily-card" target="_blank" rel="noopener noreferrer"></a>
      </section>

      <input id="search" type="search" autocomplete="off">
      <nav id="nav" class="nav"></nav>
    </div>
  </header>

  <main class="wrap">
    <div id="content"></div>
    <p id="empty" class="empty" hidden></p>
  </main>

  <footer class="wrap foot">🍎 An Apple A Day</footer>

  <script src="links.js"></script>
  <script src="app.js"></script>
</body>
</html>
